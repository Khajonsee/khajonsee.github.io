let conversations = AGENTS.map(a => [{ role: "assistant", content: a.welcome }]);
let activeTab = 0;

function switchTab(idx) {
  activeTab = idx;
  document.querySelectorAll('.nav-tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  document.querySelectorAll('.panel').forEach((p,i) => p.classList.toggle('active', i===idx));
}

function createPanel(agent, idx) {
  const panel = document.createElement('div');
  panel.className = 'panel' + (idx===0?' active':'');
  panel.id = 'panel-'+idx;

  panel.innerHTML = `
    <div class="agent-header">
      <div class="agent-avatar" style="background:${agent.gradient}">${agent.avatar}</div>
      <div>
        <div class="agent-name">${agent.name}</div>
        <div class="agent-desc">${agent.desc}</div>
      </div>
      <div class="status-dot">พร้อมใช้งาน</div>
    </div>
    <div class="quick-actions" id="qa-${idx}"></div>
    <div class="messages" id="msgs-${idx}"></div>
    <div class="input-area">
      <textarea id="inp-${idx}" placeholder="พิมพ์คำขอ... (หรือกดปุ่มด้านบน)" rows="2"></textarea>
      <button class="send-btn" id="send-${idx}" onclick="sendMsg(${idx})">➤</button>
    </div>
  `;

  // Quick actions
  const qaDiv = panel.querySelector('#qa-'+idx);
  agent.quickActions.forEach(qa => {
    const btn = document.createElement('button');
    btn.className = 'qa-btn';
    btn.textContent = qa.label;
    btn.onclick = () => sendMsg(idx, qa.prompt);
    qaDiv.appendChild(btn);
  });

  document.getElementById('panels').appendChild(panel);
  renderMessages(idx);

  // Enter to send
  panel.querySelector('#inp-'+idx).addEventListener('keydown', e => {
    if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(idx); }
  });
}

function renderMessages(idx) {
  const container = document.getElementById('msgs-'+idx);
  if(!container) return;
  container.innerHTML = '';
  conversations[idx].forEach(msg => {
    const div = document.createElement('div');
    div.className = 'msg ' + msg.role;
    if(msg.role==='assistant') {
      div.innerHTML = `<div class="msg-avatar" style="background:${AGENTS[idx].gradient};color:#fff">${AGENTS[idx].avatar}</div><div class="msg-bubble">${escHtml(msg.content)}</div>`;
    } else {
      div.innerHTML = `<div class="msg-bubble">${escHtml(msg.content)}</div>`;
    }
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

function escHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function sendMsg(idx, forcedText) {
  const inp = document.getElementById('inp-'+idx);
  const sendBtn = document.getElementById('send-'+idx);
  const text = (forcedText || inp.value).trim();
  if(!text) return;

  conversations[idx].push({ role: "user", content: text });
  inp.value = '';
  renderMessages(idx);
  sendBtn.disabled = true;

  // Show typing
  const container = document.getElementById('msgs-'+idx);
  const typing = document.createElement('div');
  typing.className = 'msg assistant';
  typing.id = 'typing-'+idx;
  typing.innerHTML = `<div class="msg-avatar" style="background:${AGENTS[idx].gradient};color:#fff">${AGENTS[idx].avatar}</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  container.appendChild(typing);
  container.scrollTop = container.scrollHeight;

  try {
    const apiKey = localStorage.getItem('krusaifiaw_api_key') || '';
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: AGENTS[idx].system,
        messages: conversations[idx].map(m => ({ role: m.role, content: m.content }))
      })
    });
    const data = await res.json();
    const reply = data.content?.find(b => b.type==="text")?.text || "ขออภัย เกิดข้อผิดพลาด";
    conversations[idx].push({ role: "assistant", content: reply });
  } catch {
    conversations[idx].push({ role: "assistant", content: "เกิดข้อผิดพลาด กรุณาลองใหม่ค่ะ" });
  } finally {
    document.getElementById('typing-'+idx)?.remove();
    sendBtn.disabled = false;
    renderMessages(idx);
  }
}

// Init
AGENTS.forEach((a, i) => createPanel(a, i));

// Login logic
function doLogin() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if(!key.startsWith('sk-ant-')) {
    document.getElementById('loginError').style.display = 'block';
    return;
  }
  localStorage.setItem('krusaifiaw_api_key', key);
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
}

// Auto-login if key exists
window.onload = function() {
  const saved = localStorage.getItem('krusaifiaw_api_key');
  if(saved && saved.startsWith('sk-ant-')) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
  }
  document.getElementById('apiKeyInput').addEventListener('keydown', e => {
    if(e.key === 'Enter') doLogin();
  });
}
